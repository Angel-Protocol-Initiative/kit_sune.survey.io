<!DOCTYPE html>
<html>
<head>
    <title>Authentication</title>
</head>
<body>

<p>Question: What walks on four legs in the morning, two in the afternoon, and three in the evening?</p>

<form action="/verify" method="POST">
    <input
        type="text"
        name="answer"
        placeholder="Your answer"
        autocomplete="off"
        required
    >
    <button type="submit">Submit</button>
</form>

</body>
</html>
